<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Letha — Synchronized reader and audiobook</title>
<!-- Equivalente Windows de la pantalla de carga de native/macos/main.swift; los tokens son copia de frontend/app/globals.css -->
<style>
:root{--base:#f1f3f6;--ink:#1a1d20;--muted:#5a6068;--accent:#2d3748;--logo-hl:rgba(45,55,72,0.14);--danger:#b42318;--dialog:linear-gradient(180deg,rgba(255,255,255,0.74) 0%,rgba(255,255,255,0.50) 100%);--ring-dialog:inset 0 0 0 1px rgba(255,255,255,0.85),inset 0 1px 0 rgba(255,255,255,0.95),0 32px 80px rgba(18,20,24,0.20);--ambient:radial-gradient(850px 700px at 4% 0%,rgba(195,205,218,0.55) 0%,rgba(195,205,218,0) 65%),radial-gradient(950px 750px at 96% 8%,rgba(165,178,192,0.35) 0%,rgba(165,178,192,0) 62%),radial-gradient(1100px 800px at 70% 60%,rgba(218,222,228,0.65) 0%,rgba(218,222,228,0) 65%),radial-gradient(950px 750px at 2% 94%,rgba(188,198,208,0.48) 0%,rgba(188,198,208,0) 62%),linear-gradient(160deg,#f7f8fa 0%,#ebeef2 100%)}
:root[data-theme="sepia"]{--base:#efe8dc;--ink:#3a2e20;--muted:#6d5c47;--accent:#544434;--logo-hl:rgba(214,180,110,0.4);--danger:#9b2a1f;--dialog:linear-gradient(180deg,rgba(255,250,242,0.74) 0%,rgba(250,244,232,0.52) 100%);--ring-dialog:inset 0 0 0 1px rgba(255,255,255,0.80),inset 0 1px 0 rgba(255,255,255,0.90),0 32px 80px rgba(58,46,32,0.20);--ambient:radial-gradient(850px 700px at 4% 0%,rgba(214,185,150,0.55) 0%,rgba(214,185,150,0) 65%),radial-gradient(950px 750px at 96% 8%,rgba(175,155,130,0.30) 0%,rgba(175,155,130,0) 62%),radial-gradient(1100px 800px at 70% 60%,rgba(230,210,180,0.65) 0%,rgba(230,210,180,0) 65%),radial-gradient(950px 750px at 2% 94%,rgba(200,175,145,0.45) 0%,rgba(200,175,145,0) 62%),linear-gradient(160deg,#f4eee4 0%,#eae2d4 100%)}
:root[data-theme="dark"]{--base:#0d0e11;--ink:#e6e9ed;--muted:#939ba6;--accent:#9ab3cf;--logo-hl:rgba(154,179,207,0.22);--danger:#f0a093;--dialog:linear-gradient(180deg,rgba(28,32,38,0.75) 0%,rgba(16,18,22,0.55) 100%);--ring-dialog:inset 0 0 0 1px rgba(255,255,255,0.09),inset 0 1px 0 rgba(255,255,255,0.14),0 32px 80px rgba(0,0,0,0.55);--ambient:radial-gradient(850px 700px at 4% 0%,rgba(65,76,92,0.45) 0%,rgba(65,76,92,0) 65%),radial-gradient(950px 750px at 96% 8%,rgba(42,52,65,0.55) 0%,rgba(42,52,65,0) 62%),radial-gradient(1100px 800px at 70% 60%,rgba(35,42,54,0.45) 0%,rgba(35,42,54,0) 65%),radial-gradient(950px 750px at 2% 94%,rgba(30,38,48,0.65) 0%,rgba(30,38,48,0) 62%),linear-gradient(160deg,#101216 0%,#090a0d 100%)}
body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background-color:var(--base);background-image:var(--ambient);color:var(--ink);font-family:system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;letter-spacing:-0.01em}
.brand svg{width:24px;height:24px}
.stack{display:flex;flex-direction:column;align-items:center;gap:22px}
.spinner{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{font-size:14px;line-height:1.6;color:var(--muted)}
.card{max-width:440px;margin:0 24px;padding:28px;border-radius:30px;background:var(--dialog);box-shadow:var(--ring-dialog)}
.card h2{margin:0 0 8px;font-family:Georgia,serif;font-size:24px;font-weight:400;color:var(--danger)}
.card .muted{white-space:pre-line}
[hidden]{display:none}
</style>
</head>
<body>
<div class="brand"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="2.4" rx="1.2" fill="var(--ink)"/><rect x="1" y="9.2" width="18" height="5.6" rx="2" fill="var(--logo-hl)"/><rect x="2" y="10.8" width="15" height="2.4" rx="1.2" fill="var(--accent)"/><rect x="2" y="17.6" width="11" height="2.4" rx="1.2" fill="var(--ink)"/></svg>Letha</div>
<div class="stack" id="loading">
  <svg class="spinner" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
  <div class="muted" id="starting"></div>
</div>
<div class="card" id="error" hidden>
  <h2 id="error-title"></h2>
  <div class="muted" id="error-message"></div>
</div>
<script>
  var STRINGS = {
    en: {
      starting: "Starting Letha…",
      errorTitle: "Letha couldn’t start",
      errorMessage: "The Letha server stopped unexpectedly.\nCheck the log at %USERPROFILE%\\.cache\\letha\\letha.log."
    },
    es: {
      starting: "Iniciando Letha…",
      errorTitle: "Error al iniciar Letha",
      errorMessage: "El servidor de Letha se detuvo inesperadamente.\nRevisa el log en %USERPROFILE%\\.cache\\letha\\letha.log."
    },
    fr: {
      starting: "Démarrage de Letha…",
      errorTitle: "Letha n’a pas pu démarrer",
      errorMessage: "Le serveur de Letha s’est arrêté de façon inattendue.\nConsultez le journal dans %USERPROFILE%\\.cache\\letha\\letha.log."
    },
    it: {
      starting: "Avvio di Letha…",
      errorTitle: "Impossibile avviare Letha",
      errorMessage: "Il server di Letha si è arrestato in modo imprevisto.\nControlla il log in %USERPROFILE%\\.cache\\letha\\letha.log."
    },
    pt: {
      starting: "Iniciando o Letha…",
      errorTitle: "Não foi possível iniciar o Letha",
      errorMessage: "O servidor do Letha parou inesperadamente.\nVeja o log em %USERPROFILE%\\.cache\\letha\\letha.log."
    }
  };

  var settings = (window.__LETHA__ && window.__LETHA__.settings) || {};
  var theme = settings.theme;
  var language = settings.native_language;

  if (theme === "sepia" || theme === "dark") document.documentElement.dataset.theme = theme;
  if (!STRINGS.hasOwnProperty(language)) language = "en";
  document.documentElement.lang = language;

  var strings = STRINGS[language];
  document.getElementById("starting").textContent = strings.starting;
  document.getElementById("error-title").textContent = strings.errorTitle;
  document.getElementById("error-message").textContent = strings.errorMessage;

  function showError() {
    document.getElementById("loading").hidden = true;
    document.getElementById("error").hidden = false;
  }

  // El servidor retiene esta petición hasta que la interfaz real está lista.
  fetch("/api/health", { cache: "no-store" }).then(function (res) {
    if (res.ok) location.reload();
    else showError();
  }, showError);
</script>
</body>
</html>
