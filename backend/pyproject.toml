[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "letha"
version = "0.2.0"
description = "Lector de PDFs y audiolibro interactivo con texto sincronizado"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pymupdf>=1.24.0",
    "edge-tts>=7.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[project.scripts]
letha = "letha.app:main"
letha-api = "letha.api:run"

[tool.hatch.build.targets.wheel]
packages = ["letha"]
artifacts = ["letha/web/**", "letha/bin/**"]
