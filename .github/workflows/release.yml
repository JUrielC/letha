name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    # La ventana nativa se compila con Swift, así que el build necesita macOS en Apple Silicon.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Verificar versión
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' backend/pyproject.toml)"
          if ! grep -q "__version__ = \"$VERSION\"" backend/letha/__init__.py \
            || ! grep -q "version=\"$VERSION\"" backend/letha/api.py \
            || ! grep -q "\"version\": \"$VERSION\"" frontend/package.json; then
            echo "::error::La versión $VERSION de backend/pyproject.toml no coincide en __init__.py, api.py y package.json"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Tests del backend
        working-directory: backend
        run: uv run --python 3.12 --extra dev pytest -q

      - name: Compilar
        run: |
          (cd frontend && bun install --frozen-lockfile)
          ./scripts/build-release.sh

      - name: Publicar release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          cat > release-notes.md <<'EOF'
          ## Instalación

          **macOS (Apple Silicon)**, en Terminal:

          ```bash
          curl -fsSL https://github.com/JUrielC/letha/releases/latest/download/install.sh | sh
          ```

          **Windows 10 / 11**, en PowerShell:

          ```powershell
          irm https://github.com/JUrielC/letha/releases/latest/download/install.ps1 | iex
          ```

          ## Cambios

          EOF
          git log --no-merges --pretty='%s' "${PREV_TAG:+$PREV_TAG..}$GITHUB_REF_NAME" > changes.txt
          sed 's/^/- /' changes.txt >> release-notes.md
          ASSETS=("dist/letha-${VERSION}-py3-none-any.whl" dist/install.sh dist/install.ps1)
          python3 scripts/update_manifest.py \
            --version "$VERSION" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --notes-file changes.txt --output latest.json "${ASSETS[@]}"
          gh release create "$GITHUB_REF_NAME" "${ASSETS[@]}" latest.json \
            --title "Letha ${VERSION}" --notes-file release-notes.md --latest --verify-tag
